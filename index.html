<!DOCTYPE html>

<style>
  :root {
    --bg: #080706;
    --card: #100f0d;

    --white: #c8c0b4;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400;

    -webkit-font-smoothing: antialiased;

  main {
    max-width: 640px;

    padding: 96px 24px;

  }
  .label {
    font-size: 12px;
    letter-spacing: 0.1em;

    margin-bottom: 14px;
  }
  h1 {

    font-weight: 400;
    font-size: 44px;
    line-height: 1.2;
    color: var(--white);
    margin-bottom: 28px;
    letter-spacing: -0.01em;
  }
  h1 .gold { color: var(--gold); font-style: italic; }

    line-height: 1.8;
    color: var(--muted);

  }
  .divider {

    margin: 40px 0;
  }
  .cta-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 56px;
    padding: 0 32px;
    background: var(--gold);
    color: var(--bg);
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 999px;
    transition: background 0.2s;
  }
  .cta-primary:hover { background: #d8b87c; }
  .cta-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    padding: 0 24px;
    border: 1px solid var(--gold-dim);
    color: var(--white);
    font-size: 14px;
    font-weight: 400;
    text-decoration: none;
    border-radius: 999px;
    margin-top: 16px;
    transition: all 0.2s;
  }
  .cta-secondary:hover {
    background: var(--gold-dim);
    color: var(--bg);
  }
  .next-label {
    font-size: 13px;
    color: var(--gold);
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .footer {
    margin-top: 64px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  @media (max-width: 640px) {
    main { padding: 64px 20px; }
    h1 { font-size: 32px; }
  }
